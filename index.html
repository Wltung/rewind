<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bản Ghi Chép Tuổi 18</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Courier+Prime&display=swap" rel="stylesheet">
</head>

<body>
    <div id="desk-wrapper">
        <div id="notebook" class="item-interactive" onclick="nextFrame()">
            <div id="frames-container"></div>
            <div class="hint">(Chạm để lật trang)</div>
        </div>

        <div class="items-row">
            <div class="icon-item" onclick="openPage('mixtape.html')">
                <div class="icon-svg">📼</div>
                <p class="hint">Mixtape</p>
            </div>
            <div class="icon-item" onclick="openPage('scrapbook.html')">
                <div class="icon-svg">📷</div>
                <p class="hint">Memories</p>
            </div>
            <div class="icon-item" onclick="openPage('letter.html')">
                <div class="icon-svg">✉️</div>
                <p class="hint">Bức thư</p>
            </div>
        </div>
    </div>

    <div id="page-overlay">
        <button id="close-btn" onclick="closePage()">Đóng ✕</button>
        <iframe id="content-frame" src=""></iframe>
    </div>

    <audio id="bg-music" src="nhac_in_love.mp3" loop></audio>
    <script src="script.js"></script>
</body>

</html>
