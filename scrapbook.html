<!DOCTYPE html>
<html lang="vi">

<head>
    <style>
        body {
            background: #D7C9AA;
            font-family: 'Caveat', cursive;
            margin: 0;
            padding: 40px 20px;
            overflow-x: auto;
            display: flex;
            gap: 30px;
        }
        
        .polaroid {
            flex: 0 0 260px;
            background: #fff;
            padding: 15px 15px 40px 15px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.1);
            transform: rotate(-2deg);
            position: relative;
        }
        
        .polaroid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .polaroid .caption {
            text-align: center;
            margin-top: 15px;
            font-size: 1.3rem;
            color: #2C3E50;
        }
        /* Băng dính (Tape) */
        
        .tape {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            border: 1px dashed rgba(0, 0, 0, 0.1);
        }
        
        .sticky-note {
            flex: 0 0 200px;
            background: #FEF9C3;
            padding: 20px;
            transform: rotate(3deg);
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="polaroid">
        <div class="tape"></div>
        <img src="https://via.placeholder.com/250x200" alt="Kỷ niệm">
        <div class="caption">Những ngày đầu tiên... </div>
    </div>

    <div class="sticky-note">
        "Chúc cậu luôn cười tươi như hôm tổng kết nhé! Đừng quên tớ đấy." [cite: 3, 5]
    </div>

    <div class="polaroid" style="transform: rotate(3deg);">
        <div class="tape"></div>
        <img src="https://via.placeholder.com/250x200" alt="Kỷ niệm">
        <div class="caption">12A5 Forever ❤️ </div>
    </div>
</body>

</html>
