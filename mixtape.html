<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        body {
            background: #333;
            color: #fff;
            margin: 0;
            padding: 20px;
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .cassette {
            width: 100%;
            max-width: 340px;
            background: #222;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        
        .label {
            background: #eee;
            color: #333;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
        }
        
        .reels {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .reel {
            width: 45px;
            height: 45px;
            border: 4px dashed #555;
            border-radius: 50%;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        .playing .reel {
            animation-play-state: running;
        }
        
        .lyrics {
            width: 100%;
            max-width: 340px;
            height: 150px;
            overflow-y: scroll;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        
        .line {
            opacity: 0.3;
            transition: 0.5s;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        
        .line.active {
            opacity: 1;
            color: #ffd1dc;
            transform: scale(1.1);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="cassette" id="cassette-player">
        <div class="label">Side A: In Love</div>
        <div class="reels">
            <div class="reel"></div>
            <div class="reel"></div>
        </div>
        <button onclick="parent.nextFrame()" style="width:100%; background:none; border:1px solid #fff; color:#fff; padding:10px; cursor:pointer;">PLAY / PAUSE</button>
    </div>
    <div class="lyrics" id="lyrics-box">
        <p class="line" data-time="0">"In Love" - The Lyrics </p>
        <p class="line" data-time="5">Em có nhớ ngày nắng hạ? </p>
        <p class="line" data-time="10">Sân trường vắng, phượng rơi đầy. </p>
        <p class="line" data-time="15">Ta ngồi bên nhau ghế đá... </p>
    </div>

    <script>
        const audio = window.parent.document.getElementById('bg-music');
        const lines = document.querySelectorAll('.line');
        const player = document.getElementById('cassette-player');

        audio.addEventListener('play', () => player.classList.add('playing'));
        audio.addEventListener('pause', () => player.classList.remove('playing'));

        audio.addEventListener('timeupdate', () => {
            let cur = audio.currentTime;
            lines.forEach(line => {
                let time = parseFloat(line.dataset.time);
                if (cur >= time) {
                    lines.forEach(l => l.classList.remove('active'));
                    line.classList.add('active');
                    line.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
            });
        });
    </script>
</body>

</html>
